<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corversbos">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Corversbos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f2f2f7;--sheet:rgba(246,246,248,.84);--card:#fff;--txt:#000;--dim:#8a8a8e;--sep:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--green:#34c759;--blue:#007aff;--red:#ff3b30;--orange:#ff9500;--shadow:0 6px 24px rgba(0,0,0,.16);--tabh:0px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--sheet:rgba(28,28,30,.84);--card:#2c2c2e;--txt:#fff;--dim:#98989f;--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--green:#30d158;--blue:#0a84ff;--red:#ff453a;--orange:#ff9f0a;--shadow:0 6px 24px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{opacity:.6}
input{font:inherit;-webkit-user-select:text;user-select:text}
.hide{display:none!important}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-top{top:env(safe-area-inset-top)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.5)!important;border-radius:0 0 6px 0}
.leaflet-tile-pane{filter:saturate(.8) contrast(.96)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.55) brightness(.9) contrast(.9)}}
.off-forest{fill:#cfe6c4;fill-opacity:1;stroke:#7fb36f;stroke-width:2;stroke-dasharray:6 5}
.off-road{stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.off-path{stroke:#9a7b55;stroke-width:2.2;fill:none;stroke-dasharray:4 4;stroke-linecap:round}
@media (prefers-color-scheme:dark){.off-forest{fill:#16261a;stroke:#3d6b44}.off-road{stroke:#3a3a3c}.off-path{stroke:#a08560}}
#offline{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:950;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.glass{background:var(--sheet);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}

/* kaartknoppen */
.fab{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:900;display:flex;flex-direction:column;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.fab button{width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
.fab button+button{border-top:.5px solid var(--sep)}

/* bottom sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top) - 40px);z-index:1000;border-radius:14px 14px 0 0;box-shadow:0 -1px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;transition:transform .42s cubic-bezier(.2,.9,.25,1);will-change:transform;max-width:640px;margin:0 auto}
#sheet.drag{transition:none}
[data-drag]{touch-action:none}
.grab{flex:none;padding:6px 0 2px}
.grab i{display:block;width:36px;height:5px;border-radius:3px;background:var(--dim);opacity:.5;margin:0 auto}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(28px + var(--tabh) + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;gap:10px;padding:6px 0 8px}
.hd h1{font-size:28px;font-weight:700;letter-spacing:.3px;flex:1}
.hd .back{display:flex;align-items:center;gap:4px;color:var(--blue);font-size:17px;flex:1;height:36px}
.circ{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--dim);flex:none}
.circ.blue{color:var(--blue)}
.lead{color:var(--dim);font-size:15px;margin:0 0 14px;line-height:1.4}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;height:28px;font-size:13px;font-weight:500;border-radius:7px}
.seg button:active{opacity:1}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:.5px solid var(--sep)}
button.cell:active{opacity:1;background:var(--fill)}
.thumb{width:48px;height:48px;border-radius:11px;flex:none;display:grid;place-items:center}
.cell .t{flex:1;min-width:0}
.cell b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .m{font-size:14px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chev{color:var(--dim);opacity:.55;flex:none}
.done{font-size:13px;font-weight:600;color:var(--green);flex:none}
.badge{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.sect{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.2px;margin:24px 16px 7px}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;font-weight:600;background:var(--green);color:#fff}
.pill.gray{background:var(--card);color:var(--blue)}
.pill.red{background:var(--card);color:var(--red)}
.pill+.pill{margin-top:10px}
.sq{width:50px;height:50px;border-radius:14px;background:var(--card);color:var(--blue);display:grid;place-items:center;flex:none}
.link{display:block;margin:16px auto 0;color:var(--dim);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.tile{background:var(--card);border-radius:12px;padding:9px 12px;min-width:0}
.tile span{font-size:12px;color:var(--dim);display:block}
.tile b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile b small{font-size:14px;font-weight:500;color:var(--dim);margin-left:2px}
.desc{font-size:15px;color:var(--dim);margin-bottom:14px;line-height:1.4}
.warn{display:flex;gap:10px;align-items:flex-start;background:rgba(255,159,10,.14);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;line-height:1.35}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.35}
.tip img{width:40px;height:40px;border-radius:9px;flex:none}
.tip b{display:block;font-size:15px}
.tip .circ{width:24px;height:24px}
.field{width:100%;height:46px;border-radius:12px;border:0;background:var(--card);color:var(--txt);padding:0 14px;outline:none;font-size:17px}
.row{display:flex;gap:10px;margin-top:10px}
.row .pill{margin:0}
.counter{text-align:center;font-size:15px;color:var(--dim);margin:14px 0 4px;font-variant-numeric:tabular-nums}
.rec{color:var(--red)!important}
.rec::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* weerkaart */
.wx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.wx .i{font-size:30px;line-height:1}
.wx .t{flex:1;min-width:0}
.wx b{display:block;font-size:16px;font-weight:600}
.wx span{font-size:13px;color:var(--dim)}
.wx .s{text-align:right;flex:none}
.wx .s b{font-size:16px;font-variant-numeric:tabular-nums}
.wx.load{color:var(--dim);font-size:14px;justify-content:center;min-height:58px}

/* logboek */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--card);border-radius:14px;padding:12px 6px 10px;text-align:center}
.bdg .e{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#ffd60a,#ff9f0a);box-shadow:0 4px 14px rgba(255,159,10,.35)}
.bdg.locked .e{background:var(--fill);box-shadow:none;filter:grayscale(1);opacity:.45}
.bdg b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.bdg span{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.2}

/* tabbalk */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1100;display:flex;padding:7px 0 calc(env(safe-area-inset-bottom) + 3px);border-top:.5px solid var(--sep)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10px;font-weight:500}
#tabbar button:active{opacity:1}
#tabbar button.on{color:var(--blue)}
#tabbar svg{height:25px}

/* markers */
.me{width:22px;height:22px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);position:relative}
.me::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:#0a84ff;animation:pulse 2.2s ease-out infinite;z-index:-1}
@keyframes pulse{from{transform:scale(.3);opacity:.5}to{transform:scale(1.3);opacity:0}}
.flag{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;background:#ff9f0a;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sdot{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin i{transform:rotate(45deg);font-style:normal;color:#fff;font-size:12px;font-weight:700}
.chevm{width:14px;height:14px;animation:fadein .4s 1s both}
@keyframes fadein{from{opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* toast & modal */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);z-index:3500;padding:10px 18px;border-radius:22px;font-size:15px;font-weight:600;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.25,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mcard{width:100%;max-width:420px;background:var(--bg);border-radius:22px;padding:20px;animation:up .4s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(110%)}}
.mcard h2{font-size:22px;margin:10px 0 4px}

/* navigatiescherm (Zoek mijn-stijl) */
#follow{position:fixed;inset:0;z-index:2000;background:#000;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 14px);transition:background .45s ease}
#follow.al{background:#1e9b45}
#follow.off{background:#3a2400}
#follow.hot{background:#b8410f}
.ftop{display:flex;align-items:center;gap:12px;min-height:44px}
.ftop .ttl{flex:1;text-align:center;min-width:0}
.ftop .ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftop .ttl span{font-size:13px;opacity:.65}
.fbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;flex:none}
.stage{flex:1;position:relative;display:grid;place-items:center;min-height:200px}
#ring{position:absolute;left:50%;top:50%;width:min(74vw,300px,38vh);height:min(74vw,300px,38vh);transform:translate(-50%,-50%) rotate(-90deg);overflow:visible}
#ringP{transition:stroke-dasharray .6s ease}
#dots{position:absolute;inset:0;width:100%;height:100%}
#arrow{position:relative;width:min(36vw,150px,20vh);height:min(36vw,150px,20vh);transition:transform .25s linear,opacity .3s;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
#dist{font-size:min(22vw,92px);font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
#dist small{font-size:.38em;font-weight:600;letter-spacing:0;margin-left:6px;opacity:.75}
#dir{font-size:28px;font-weight:600;margin-top:4px}
#next{font-size:16px;opacity:.8;margin-top:6px;min-height:21px;display:flex;align-items:center;gap:8px}
#next svg{flex:none}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.fstats div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 11px}
.fstats span{font-size:12px;opacity:.65;display:block}
.fstats b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.factions{display:flex;gap:10px}
.factions button{flex:1;height:48px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#found{position:absolute;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px}
.fcard{background:#1c1c1e;border-radius:26px;padding:0 22px 20px;text-align:center;max-width:380px;width:100%;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.femoji{font-size:60px;width:112px;height:112px;margin:-56px auto 12px;border-radius:50%;background:linear-gradient(145deg,#ffd60a,#ff9f0a);display:grid;place-items:center;box-shadow:0 10px 40px rgba(255,159,10,.5);border:5px solid #1c1c1e}
.fsmall{font-size:13px;opacity:.6;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.fcard h2{font-size:25px;margin:4px 0 8px}
.fcard p{opacity:.8;margin:0 0 20px;line-height:1.45;font-size:16px}
#finish{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 20px);text-align:center;overflow-y:auto}
.fin-in{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;margin:auto 0;position:relative;z-index:3}
.fin-check{width:84px;height:84px;border-radius:50%;background:#30d158;display:grid;place-items:center;margin-bottom:16px;animation:pop .55s cubic-bezier(.3,1.6,.5,1);box-shadow:0 10px 40px rgba(48,209,88,.5);flex:none}
@keyframes pop{from{transform:scale(0)}}
#finish h2{font-size:26px;font-weight:700}
#finish p{opacity:.7;margin:6px 0 0;font-size:16px}
#finMap{width:100%}
#finMap svg{display:block;width:100%;height:150px;background:rgba(255,255,255,.07);border-radius:16px;margin-top:18px}
#finish .fstats{width:100%;margin:12px 0}
#finBadges{width:100%}
.nb{display:flex;align-items:center;gap:12px;background:rgba(255,214,10,.16);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.nb .e{font-size:28px}
.nb b{display:block;font-size:15px}
.nb span{font-size:13px;opacity:.7}
#finOk{margin-top:6px}
#mapbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:1500;height:56px;border-radius:16px;background:#000;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:600px;margin:0 auto}
#mapbar b{flex:1;text-align:left;font-size:16px}
#mapbar span{color:#30d158;font-weight:600}
</style>
</head>
<body>
<div id="map"></div>

<div class="fab glass">
  <button id="locBtn" aria-label="Mijn locatie"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 2.5 2.8 10.4c-.8.4-.7 1.5.1 1.7l7.4 1.6 1.6 7.4c.2.8 1.3.9 1.7.1z"/></svg></button>
  <button id="forestBtn" aria-label="Heel het bos"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 7 9h2.6L6 14h4.5v-.1L6 20h5v2h2v-2h5l-4.5-6.1V14H18l-3.6-5H17z"/></svg></button>
</div>

<div id="sheet" class="glass">
  <div class="grab" data-drag><i></i></div>
  <div class="view" id="vList"></div>
  <div class="view hide" id="vLog"></div>
  <div class="view hide" id="vDetail"></div>
  <div class="view hide" id="vMake">
    <div class="hd" data-drag><h1 id="makeTitle">Nieuwe route</h1><button class="circ" id="cancelMake" aria-label="Annuleren"><svg width="11" height="11" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>
    <p class="lead" id="makeLead"></p>
    <input class="field" id="name" placeholder="Naam" autocomplete="off">
    <div class="counter" id="makeInfo"></div>
    <div class="row"><button class="pill gray" id="undoBtn">Ongedaan maken</button><button class="pill gray" id="recBtn">Opnemen</button></div>
    <button class="pill" id="saveBtn" style="margin-top:10px">Bewaren</button>
  </div>
</div>

<nav id="tabbar" class="glass">
  <button data-tab="routes" class="on"><svg viewBox="0 0 26 24" width="27"><path d="M4 19c4-1 3.5-7 8-8s5 4 9 2 1.5-7 1.5-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="4" cy="19" r="2.6" fill="currentColor"/><circle cx="22.5" cy="6" r="2.6" fill="currentColor"/></svg>Routes</button>
  <button data-tab="hunts"><svg viewBox="0 0 24 24" width="25" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m15.6 15.6 5.2 5.2"/><path d="m10.5 7.4.9 2.1 2.2.2-1.7 1.5.5 2.2-1.9-1.2-1.9 1.2.5-2.2-1.7-1.5 2.2-.2z" fill="currentColor" stroke="none"/></svg>Speurtocht</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" width="25" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M8 2h8l-2.2 6.5h-3.6z"/><circle cx="12" cy="15" r="6.3"/><path d="m12 11.6 1.1 2.2 2.4.3-1.7 1.6.4 2.4-2.2-1.2-2.2 1.2.4-2.4-1.7-1.6 2.4-.3z" fill="currentColor" stroke="none"/></svg>Logboek</button>
</nav>

<div id="toast" class="glass"></div>
<div id="offline" class="glass hide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M3 3l18 18"/></svg>Offline · bos-kaart</div>
<div id="modal" class="hide"><div class="mcard" id="mcard"></div></div>
<button id="mapbar" class="hide"><svg width="20" height="20" viewBox="0 0 24 24" fill="#30d158"><path d="M12 3 20 20 12 16 4 20z"/></svg><b id="mapbarName"></b><span>Terug</span></button>

<div id="follow" class="hide">
  <div class="ftop">
    <button class="fbtn" id="stopBtn" aria-label="Stop"><svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button>
    <div class="ttl"><b id="fname"></b><span id="fstep"></span></div>
    <button class="fbtn" id="soundBtn" aria-label="Geluid"></button>

const R=6371000,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function dist(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return (deg(Math.atan2(y,x))+360)%360}
const turnAngle=(a,b)=>((b-a+540)%360)-180;
const pathLen=pts=>pts.reduce((s,p,i)=>i?s+dist(pts[i-1],p):0,0);
function segDist(p,a,b){ // afstand punt tot lijnstuk, lokaal plat benaderd
  const k=Math.cos(rad(p[0])),ax=(a[1]-p[1])*k,ay=a[0]-p[0],bx=(b[1]-p[1])*k,by=b[0]-p[0];
  const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0;
  return Math.hypot(ax+dx*t,ay+dy*t)*111320;
}

/* ---------- delen via link (route zit in de link zelf) ---------- */
function encPoly(pts){let o='',pa=0,pb=0;const e=v=>{v=v<0?~(v<<1):v<<1;let s='';while(v>=32){s+=String.fromCharCode((32|(v&31))+63);v>>=5}return s+String.fromCharCode(v+63)};for(const[a,b]of pts){const A=Math.round(a*1e5),B=Math.round(b*1e5);o+=e(A-pa)+e(B-pb);pa=A;pb=B}return o}
function decPoly(s){const pts=[];let i=0,a=0,b=0;const d=()=>{let r=0,sh=0,c;do{c=s.charCodeAt(i++)-63;r|=(c&31)<<sh;sh+=5}while(c>=32);return r&1?~(r>>1):r>>1};while(i<s.length){a+=d();b+=d();pts.push([a/1e5,b/1e5])}return pts}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function shareLink(r){
  const data={t:r.type,n:r.name,c:r.color,p:encPoly(r.pts)};
  if(r.cps)data.k=r.cps.map(c=>[c.e,c.n,c.h||'',c.t||'']);
  return location.origin+location.pathname+'#deel='+b64e(JSON.stringify(data));
}
async function shareRoute(r){
  const url=shareLink(r),text=r.type==='hunt'?`Doe de speurtocht “${r.name}” in het Corversbos`:`Loop de route “${r.name}” in het Corversbos`;
  try{if(navigator.share){await navigator.share({title:r.name,text,url});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link gekopieerd')}catch(e){prompt('Kopieer deze link:',url)}
}
function checkImport(){
  const m=location.hash.match(/^#deel=([\w-]+)/);if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const d=JSON.parse(b64d(m[1])),r={id:'u'+Date.now(),type:d.t==='hunt'?'hunt':'route',name:String(d.n).slice(0,60),color:/^#[0-9a-f]{6}$/i.test(d.c)?d.c:COLORS[0],pts:decPoly(d.p)};
    if(d.k)r.cps=d.k.map(c=>({e:c[0],n:c[1],h:c[2],t:c[3]}));
    if(r.pts.length<2&&r.type==='route')throw 0;
    r.len=pathLen(r.pts);
    modal(`${thumb(r)}<h2>${r.type==='hunt'?'Speurtocht':'Route'} ontvangen</h2><p class="desc">“${esc(r.name)}” · ${r.type==='hunt'?r.pts.length+' schatten':fmt(r.len)}</p><button class="pill" id="mOk">Toevoegen</button><button class="pill gray" id="mNo">Niet nu</button>`);
    $('mOk').onclick=()=>{closeModal();const{len,...plain}=r;routes.push(plain);saveRoutes(routes);routes=getRoutes();setTab(r.type==='hunt'?'hunts':'routes');openDetail(routes.find(x=>x.id===r.id));toast('Toegevoegd')};
    $('mNo').onclick=closeModal;
  }catch(e){toast('Deze link werkt niet')}
}

function chevrons(pts){
  let acc=0;
  for(let i=1;i<pts.length;i++){
    acc+=dist(pts[i-1],pts[i]);
    if(acc<80)continue;acc=0;
    const m=[(pts[i-1][0]+pts[i][0])/2,(pts[i-1][1]+pts[i][1])/2];
    L.marker(m,{icon:icon(`<div class="chevm" style="transform:rotate(${bearing(pts[i-1],pts[i])}deg)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 9.5 7 5.5l4 4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`,14),interactive:false}).addTo(routeLayer);
  }
}
function huntPins(r,op){
  L.polyline(r.pts,{color:r.color,weight:3,opacity:op*.8,dashArray:'1 9',lineCap:'round',interactive:false}).addTo(routeLayer);
  r.pts.forEach((p,i)=>L.marker(p,{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${r.color};opacity:${op}"><i>${i+1}</i></div>`,iconSize:[26,26],iconAnchor:[13,30]})}).on('click',()=>{if(canOpen())openDetail(r)}).addTo(routeLayer));
}
function drawRoutes(){
  routeLayer.clearLayers();
  let vis;
  if(view==='make'||view==='log')vis=routes;
  else if(view==='detail'&&selected)vis=routes.filter(r=>r.type===selected.type);
  else vis=tab==='hunts'?routes.filter(r=>r.type==='hunt'):filtered();
  const faded=view==='make'||view==='log';
  vis.forEach(r=>{
    const isSel=selected&&selected.id===r.id,op=faded?.3:selected&&!isSel?.2:1;
    if(r.type==='hunt'){
      if(faded||(selected&&!isSel))L.polyline(r.pts,{color:r.color,weight:3,opacity:op,dashArray:'1 9',lineCap:'round',interactive:false}).addTo(routeLayer);
      else huntPins(r,op);
      return;
    }
    const pts=isSel&&detailRev?[...r.pts].reverse():r.pts,animate=isSel&&animatedId!==r.id+detailRev;
    const casing=L.polyline(pts,{color:'#fff',weight:9,opacity:op*.9,interactive:false,className:animate?'draw':''}).addTo(routeLayer);
    const line=L.polyline(pts,{color:r.color,weight:5,opacity:op,className:animate?'draw':''}).addTo(routeLayer);
    if(animate){animatedId=r.id+detailRev;[casing,line].forEach(l=>l.getElement()&&l.getElement().setAttribute('pathLength','1'))}
    line.on('click',e=>{L.DomEvent.stop(e);if(canOpen())openDetail(r)});
    if(!selected&&!faded)L.marker(r.pts[0],{icon:icon(`<div class="sdot" style="background:${r.color}"></div>`,14),interactive:false}).addTo(routeLayer);
    if(isSel){
      chevrons(pts);
      L.marker(pts[0],{icon:icon(`<div class="flag" style="background:${r.color}">${ICON.play.replace('width="15" height="15"','width="11" height="11"')}</div>`,28),interactive:false}).addTo(routeLayer);
    }
  });
}

let W=null;
const WX={0:['☀️','Helder'],1:['🌤️','Licht bewolkt'],2:['⛅','Half bewolkt'],3:['☁️','Bewolkt'],45:['🌫️','Mist'],48:['🌫️','Mist'],51:['🌦️','Motregen'],53:['🌦️','Motregen'],55:['🌦️','Motregen'],56:['🌧️','IJzel'],57:['🌧️','IJzel'],61:['🌧️','Lichte regen'],63:['🌧️','Regen'],65:['🌧️','Zware regen'],66:['🌧️','IJzel'],67:['🌧️','IJzel'],71:['🌨️','Sneeuw'],73:['🌨️','Sneeuw'],75:['🌨️','Sneeuw'],77:['🌨️','Sneeuw'],80:['🌦️','Buien'],81:['🌦️','Buien'],82:['⛈️','Zware buien'],85:['🌨️','Sneeuwbuien'],86:['🌨️','Sneeuwbuien'],95:['⛈️','Onweer'],96:['⛈️','Onweer'],99:['⛈️','Onweer']};
async function loadWeather(){
  try{
    const j=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.231&longitude=5.149&current=temperature_2m,weather_code,precipitation,is_day&hourly=precipitation_probability&daily=sunrise,sunset&timezone=Europe%2FAmsterdam&forecast_days=2')).json();
    const now=Date.now(),hrs=j.hourly.time.map(t=>new Date(t).getTime());
    let rainAt=null;
    for(let i=0;i<hrs.length;i++){if(hrs[i]+3600e3<=now)continue;if(hrs[i]>now+3*3600e3)break;if(j.hourly.precipitation_probability[i]>=50){rainAt=Math.max(hrs[i],now);break}}
    const sets=j.daily.sunset.map(t=>new Date(t).getTime()),rises=j.daily.sunrise.map(t=>new Date(t).getTime());
    W={temp:Math.round(j.current.temperature_2m),code:j.current.weather_code,precip:j.current.precipitation,day:!!j.current.is_day,
       sunset:sets[0],sunrise:rises.find(t=>t>now)||rises[0],rainAt};
  }catch(e){W={error:true}}
  if(view==='list'&&tab==='routes')renderList();else if(view==='detail')renderDetail();
}
function weatherHTML(){
  if(!W)return '<div class="wx load">Weer laden…</div>';
  if(W.error)return '';
  const [em,txt]=WX[W.code]||['🌡️',''],night=!W.day,now=Date.now();
  const e=night&&W.code<=2?'🌙':em;
  const rain=W.precip>0?'Het regent nu, jas aan!':W.rainAt?`Kans op regen rond ${hhmm(W.rainAt)}`:'Droog de komende uren';
  const sun=now<W.sunset?['Zon onder',hhmm(W.sunset)]:['Zon op',hhmm(W.sunrise)];
  return `<div class="wx"><div class="i">${e}</div><div class="t"><b>${W.temp}° · ${txt}</b><span>${rain}</span></div><div class="s"><span>${sun[0]}</span><b>${sun[1]}</b></div></div>`;
}
function warnings(r){
  if(!W||W.error)return '';
  const now=Date.now(),end=now+minutes(r.len)*60e3,out=[];
  if(now>W.sunset)out.push(['🌙','Het is al donker. Neem een lampje mee en blijf op de paden.']);
  else if(end>W.sunset-15*60e3)out.push(['🌇',`De zon gaat om ${hhmm(W.sunset)} onder. ${end>W.sunset?'Je bent dan nog onderweg.':'Je bent dan net klaar.'}`]);
  if(W.precip>0)out.push(['🌧️','Het regent op dit moment.']);
  else if(W.rainAt&&W.rainAt<end)out.push(['🌦️',`Kans op regen rond ${hhmm(W.rainAt)}, voordat je klaar bent.`]);
  return out.map(([e,t])=>`<div class="warn"><span>${e}</span><span>${t}</span></div>`).join('');
}

const sheet=$('sheet'),tabbar=$('tabbar');let snap='half',suppressClick=0;
const tabH=()=>tabbar.classList.contains('hide')?0:tabbar.offsetHeight;
function snaps(){const H=sheet.offsetHeight,t=tabH();return{full:0,half:Math.max(0,H-Math.round(innerHeight*.5)-t*.3),low:Math.max(0,H-(view==='make'?350:200)-t)}}
function setSnap(s){snap=s;sheet.style.transform=`translateY(${snaps()[s]}px)`}
const sheetVisible=()=>sheet.classList.contains('hide')?0:sheet.offsetHeight-snaps()[snap];
let drag=null;
sheet.addEventListener('pointerdown',e=>{
  if(!e.target.closest('[data-drag]'))return;
  drag={id:e.pointerId,y:e.clientY,start:snaps()[snap],cur:snaps()[snap],moved:false,lastY:e.clientY,lastT:e.timeStamp,v:0,onGrab:!!e.target.closest('.grab')};
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dy=e.clientY-drag.y;
  if(!drag.moved){if(Math.abs(dy)<6)return;drag.moved=true;sheet.classList.add('drag')}
  const s=snaps(),y=Math.min(s.low+50,Math.max(-16,drag.start+dy));
  drag.v=(e.clientY-drag.lastY)/Math.max(1,e.timeStamp-drag.lastT);drag.lastY=e.clientY;drag.lastT=e.timeStamp;drag.cur=y;
  sheet.style.transform=`translateY(${y}px)`;
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){if(d.onGrab)setSnap(snap==='full'?'half':'full');return}
  sheet.classList.remove('drag');suppressClick=Date.now()+350;
  const s=snaps(),proj=d.cur+d.v*220;let best=snap,bd=1e9;
  for(const k in s){const dd=Math.abs(s[k]-proj);if(dd<bd){bd=dd;best=k}}
  setSnap(best);
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
sheet.addEventListener('click',e=>{if(Date.now()<suppressClick){e.stopPropagation();e.preventDefault()}},true);
addEventListener('resize',()=>{setTabH();setSnap(snap)});

function thumb(r,size=48){
  const k=Math.cos(rad(52.23)),xs=r.pts.map(p=>p[1]*k),ys=r.pts.map(p=>-p[0]);
  const x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0,h=Math.max(...ys)-y0,s=32/Math.max(w,h,1e-9);
  const P=i=>[((xs[i]-x0)*s+(48-w*s)/2).toFixed(1),((ys[i]-y0)*s+(48-h*s)/2).toFixed(1)];
  const d=r.pts.map((p,i)=>(i?'L':'M')+P(i).join(' ')).join('');
  const hunt=r.type==='hunt';
  const extra=hunt?r.pts.map((p,i)=>`<circle cx="${P(i)[0]}" cy="${P(i)[1]}" r="3.2" fill="${r.color}"/>`).join(''):'';
  return `<div class="thumb" style="background:${r.color}26;width:${size}px;height:${size}px;border-radius:${size*.23}px"><svg width="${size}" height="${size}" viewBox="0 0 48 48"><path d="${d}" fill="none" stroke="${r.color}" stroke-width="${hunt?2:3}" ${hunt?'stroke-dasharray="1 4"':''} stroke-linejoin="round" stroke-linecap="round"/>${extra}</svg></div>`;
}
function badge(r){
  if(r.type==='hunt')return `<span class="badge" style="color:#ff9f0a;background:#ff9f0a24">Speurtocht</span>`;
  const L_=LEVELS[level(r.len)];return `<span class="badge" style="color:${L_.c};background:${L_.c}24">${L_.l}</span>`;
}
function cellHTML(r,h){
  const n=h.filter(x=>x.id===r.id).length,hunt=r.type==='hunt';
  return `<button class="cell" data-id="${esc(r.id)}">${thumb(r)}<div class="t"><b>${esc(r.name)}</b><div class="m">${hunt?`${r.pts.length} schatten · ${fmt(r.len)}`:`${fmt(r.len)} · ${minutes(r.len)} min`} ${badge(r)}</div>${me?`<div class="m">${fmt(dist(me,r.pts[0]))} hiervandaan</div>`:''}</div>${n?`<span class="done">✓ ${n}×</span>`:''}<span class="chev">${ICON.chev}</span></button>`;
}

function renderList(){
  lastListRender=Date.now();
  const hunt=tab==='hunts',h=getHistory(),rs=hunt?routes.filter(r=>r.type==='hunt'):filtered();
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;

/* ---------- navigeren (Zoek mijn-stijl) ---------- */
const F={route:null,base:null,hunt:false,rev:false,phase:'start',idx:0,t0:0,walked:0,last:null,track:[],spoken:{},sound:ls.get(SKEY,true),wake:null,done:false,paused:false,sim:null,simUsed:false,d:null,rel:0,aligned:false,arrowRot:null};
const SND_ON='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const SND_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="m16 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const TURN_L='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-7a4 4 0 0 0-4-4H5M9 5 5 9l4 4"/></svg>';
const TURN_R='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20v-7a4 4 0 0 1 4-4h8M15 5l4 4-4 4"/></svg>';
$('soundBtn').innerHTML=F.sound?SND_ON:SND_OFF;
$('soundBtn').onclick=()=>{F.sound=!F.sound;ls.set(SKEY,F.sound);$('soundBtn').innerHTML=F.sound?SND_ON:SND_OFF;if(!F.sound)try{speechSynthesis.cancel()}catch(e){}};

function say(t){if(!F.sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
const buzz=p=>{try{navigator.userActivation&&navigator.userActivation.hasBeenActive&&navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function keepAwake(on){
  try{if(on&&'wakeLock'in navigator&&!F.wake){F.wake=await navigator.wakeLock.request('screen');F.wake.addEventListener('release',()=>F.wake=null)}
      else if(!on&&F.wake){await F.wake.release();F.wake=null}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&F.route&&!F.done)keepAwake(true)});

function startFollow(base,rev=false){
  const r=rev?{...base,pts:[...base.pts].reverse()}:base,hunt=r.type==='hunt';
  Object.assign(F,{route:r,base,rev,hunt,phase:hunt?'route':'start',idx:0,t0:Date.now(),walked:0,last:null,track:[],spoken:{},done:false,paused:false,simUsed:false,d:null,rel:0,arrowRot:null});
  stopSim();
  $('finish').classList.add('hide');$('found').classList.add('hide');$('fname').textContent=r.name;
  $('follow').classList.remove('hide','al','off','hot');
  startGPS();startCompass();keepAwake(true);
  say(hunt?`${r.name}. Volg de pijl naar de eerste schat.`:`${r.name}. Loop naar het startpunt.`);
  if(me)onMove();else render();
  startDots();
}
function nextTurn(){
  const p=F.route.pts;let acc=dist(me,p[F.idx]);
  for(let j=F.idx;j<p.length-1&&acc<220;j++){
    if(j>=1){const a=turnAngle(bearing(p[j-1],p[j]),bearing(p[j],p[j+1]));if(Math.abs(a)>40)return{j,d:acc,a}}
    acc+=dist(p[j],p[j+1]);
  }
  return null;
}
const turnWord=a=>(Math.abs(a)>115?'scherp ':'')+(a<0?'linksaf':'rechtsaf');
const heat=d=>d<30?['🔥','Heet! Kijk goed om je heen']:d<70?['♨️','Warm']:d<150?['🌤️','Lauw']:['❄️','Koud'];
function onMove(){
  if(!F.route||F.done||F.paused)return;
  const p=F.route.pts,last=p.length-1;
  if(F.last){const s=dist(F.last,me);if(s>3){if(F.phase==='route'&&s<80){F.walked+=s;F.track.push([+me[0].toFixed(5),+me[1].toFixed(5)])}F.last=[...me]}}else F.last=[...me];
  if(F.hunt){if(dist(me,p[F.idx])<HUNT_RADIUS)return showFound();return render()}
  if(F.phase==='start'&&dist(me,p[0])<START_RADIUS){
    Object.assign(F,{phase:'route',idx:1,t0:Date.now(),walked:0,track:[[...p[0]]]});
    buzz([40,60,40]);say('Je bent bij het startpunt. Volg de pijl.');
  }
  if(F.phase==='route'){
    for(let j=Math.min(last,F.idx+4);j>F.idx;j--)if(dist(me,p[j])<ARRIVE){F.idx=j;break} // bocht afgesneden
    while(F.idx<last&&dist(me,p[F.idx])<ARRIVE){F.idx++;buzz(25)}
    if(F.idx===last&&dist(me,p[last])<ARRIVE)return finish();
    const t=nextTurn();
    if(t&&t.d<40&&!F.spoken[t.j]){F.spoken[t.j]=1;say(`Zo meteen ${turnWord(t.a)}`);buzz([30,50,30])}
  }
  render();
}
function showFound(){
  F.paused=true;
  const p=F.route.pts,c=(F.route.cps||[])[F.idx]||{e:'⭐',n:`Schat ${F.idx+1}`,t:'Gevonden!'},lastOne=F.idx===p.length-1;
  $('foundEmoji').textContent=c.e;$('foundStep').textContent=`Schat ${F.idx+1} van ${p.length} gevonden`;
  $('foundTitle').textContent=c.n;$('foundText').textContent=c.t||'';
  $('foundNext').textContent=lastOne?'Afronden':'Volgende schat';
  $('follow').classList.remove('al','hot');$('found').classList.remove('hide');
  buzz([50,60,50]);say(`Gevonden! ${c.n}. ${c.t||''}`);confetti($('foundConf'),60);
}
$('foundNext').onclick=()=>{
  $('found').classList.add('hide');F.paused=false;
  if(F.idx===F.route.pts.length-1)return finish();
  F.idx++;const c=(F.route.cps||[])[F.idx];
  say(c&&c.h?`Volgende schat. Hint: ${c.h}`:'Op naar de volgende schat!');
  render();
};
function render(){
  if(!F.route||F.done)return;
  const p=F.route.pts,last=p.length-1,start=F.phase==='start',target=start?p[0]:p[F.idx];
  $('fstep').textContent=F.hunt?`Schat ${F.idx+1} van ${p.length}`:start?'Naar het startpunt':`Punt ${F.idx} van ${last}`;
  if(!me){$('dist').textContent='–';$('dir').textContent='GPS zoeken…';$('next').textContent='';F.d=null;renderStats();return}
  const d=dist(me,target),b=bearing(me,target),rel=heading==null?b:(b-heading+360)%360,off=Math.min(rel,360-rel);
  F.d=d;F.rel=rel;
  const cur=F.arrowRot??rel;F.arrowRot=cur+turnAngle(((cur%360)+360)%360,rel); // kortste kant op draaien
  $('arrow').style.transform=`rotate(${F.arrowRot}deg)`;
  const offRoute=!F.hunt&&!start&&Math.min(segDist(me,p[F.idx-1],p[F.idx]),F.idx<last?segDist(me,p[F.idx],p[F.idx+1]):1e9)>OFF_ROUTE;
  const aligned=heading!=null&&off<20;
  if(aligned&&!F.aligned)buzz(15);F.aligned=aligned;
  const hot=F.hunt&&d<30;
  $('follow').classList.toggle('hot',hot);
  $('follow').classList.toggle('al',aligned&&!offRoute&&!hot);$('follow').classList.toggle('off',offRoute);
  $('dist').innerHTML=d>=1000?`${(d/1000).toFixed(1).replace('.',',')}<small>km</small>`:`${Math.round(d)}<small>m</small>`;
  $('dir').textContent=heading==null?(F.hunt?heat(d)[1].split('!')[0].toLowerCase():'naar het doel'):aligned?'rechtdoor':off>150?'achter je':rel<180?'naar rechts':'naar links';
  let nx='';
  if(F.hunt){const c=(F.route.cps||[])[F.idx],[e,t]=heat(d);nx=`${e} ${t}${c&&c.h&&d>=30?` · ${esc(c.h)}`:''}`}
  else if(offRoute)nx='⚠︎ Je loopt van de route af';
  else if(start)nx='Daar begint de route';
  else if(heading==null)nx='Geen kompas: pijl wijst t.o.v. het noorden';
  else{const t=nextTurn();if(t)nx=(t.a<0?TURN_L:TURN_R)+(t.d<15?`Nu ${turnWord(t.a)}`:`Over ${fmt(Math.round(t.d/5)*5)} ${turnWord(t.a)}`)}
  $('next').innerHTML=nx;
  renderStats();
}
function remaining(){
  if(!me||!F.route)return null;const p=F.route.pts;
  if(F.phase==='start')return F.route.len;
  return dist(me,p[F.idx])+pathLen(p.slice(F.idx));
}
function renderStats(){
  if(!F.route||F.done)return;
  const rem=remaining(),p=F.route.pts;
  $('sTime').textContent=F.phase==='route'?fmtTime((Date.now()-F.t0)/1000):'0:00';
  $('sWalk').textContent=fmt(F.walked);
  $('sLeft').textContent=rem==null?'–':fmt(rem);
  const pct=F.hunt?F.idx/p.length*100:rem==null||F.phase==='start'?0:Math.max(0,Math.min(100,(1-rem/F.route.len)*100));
  $('ringP').setAttribute('stroke-dasharray',`${pct.toFixed(1)} 100`);
}
setInterval(renderStats,1000);

function trackSVG(routePts,track,color){
  const all=[...routePts,...track],k=Math.cos(rad(52.23)),W_=320,H_=150,pad=16;
  const xs=all.map(p=>p[1]*k),ys=all.map(p=>-p[0]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0,h=Math.max(...ys)-y0;
  const s=Math.min((W_-2*pad)/Math.max(w,1e-9),(H_-2*pad)/Math.max(h,1e-9)),ox=(W_-w*s)/2,oy=(H_-h*s)/2;
  const path=pts=>pts.map((p,i)=>(i?'L':'M')+((p[1]*k-x0)*s+ox).toFixed(1)+' '+((-p[0]-y0)*s+oy).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W_} ${H_}" preserveAspectRatio="xMidYMid meet"><path d="${path(routePts)}" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>${track.length>1?`<path d="${path(track)}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" class="draw"/>`:''}</svg>`;
}
function finish(){
  F.done=true;stopSim();keepAwake(false);
  const r=F.route,base=F.base,secs=(Date.now()-F.t0)/1000,m=F.walked>r.len*.5?F.walked:r.len;
  const step=Math.ceil(F.track.length/250)||1,track=F.track.filter((_,i)=>i%step===0);
  const h=getHistory(),before=earned(h);
  h.push({id:base.id,name:base.name,type:base.type,at:Date.now(),secs:Math.round(secs),meters:Math.round(m),track,rev:F.rev||undefined,sim:F.simUsed||undefined,rain:W&&W.precip>0||undefined});
  ls.set(HKEY,h);
  const mine=h.filter(x=>x.id===base.id),n=mine.length,best=Math.min(...mine.map(x=>x.secs)),fresh=BADGES.filter(b=>earned(h).includes(b.n)&&!before.includes(b.n));
  $('follow').classList.remove('al','off','hot');
  $('finTitle').textContent=F.hunt?'Alle schatten gevonden!':`${r.name} voltooid`;
  $('finSub').textContent=F.hunt?`${r.name} · ${r.pts.length} schatten`:n===1?'Je eerste keer op deze route!':best>=Math.round(secs)?`Nieuw record! Dit was keer ${n}.`:`Dit was keer ${n} op deze route.`;
  $('finMap').innerHTML=trackSVG(r.pts,track,r.color);
  $('finTime').textContent=fmtTime(secs);$('finDist').textContent=fmt(m);
  const ps=Math.round(secs/(m/1000));$('finPace').innerHTML=`${Math.floor(ps/60)}'${String(ps%60).padStart(2,'0')}"<small style="font-size:12px;opacity:.6"> /km</small>`;
  $('finBadges').innerHTML=fresh.map((b,i)=>`<div class="nb" style="animation-delay:${.5+i*.15}s"><div class="e">${b.e}</div><div><b>Nieuwe badge: ${b.n}</b><span>${b.d}</span></div></div>`).join('');
  $('finish').classList.remove('hide');$('finish').scrollTop=0;
  buzz([60,80,60,80,120]);say(F.hunt?`Gefeliciteerd! Je hebt alle schatten gevonden.`:`Gefeliciteerd! Je hebt de ${r.name} uitgelopen.`);confetti($('confetti'),140);
}
function closeFollow(){
  stopSim();keepAwake(false);try{speechSynthesis.cancel()}catch(e){}
  F.route=null;F.done=false;F.paused=false;fakePos=false;F.arrowRot=null;
  $('follow').classList.add('hide');$('mapbar').classList.add('hide');sheet.classList.remove('hide');tabbar.classList.remove('hide');setTabH();
  routes=getRoutes();
  if(selected){selected=routes.find(r=>r.id===selected.id)||null}
  if(selected){showView('detail');renderDetail()}else setTab(tab);
}
$('finOk').onclick=closeFollow;
$('stopBtn').onclick=()=>{if((F.phase==='route'&&F.walked>50||F.hunt&&F.idx>0)&&!confirm('Stoppen?'))return;closeFollow()};
$('mapBtn').onclick=()=>{
  $('follow').classList.add('hide');sheet.classList.add('hide');tabbar.classList.add('hide');
  $('mapbarName').textContent=F.route.name;$('mapbar').classList.remove('hide');
  selected=F.base;detailRev=F.rev;animatedId=null;view='detail';drawRoutes();
  map.fitBounds(L.latLngBounds(me?[...F.route.pts,me]:F.route.pts),{paddingTopLeft:[40,60],paddingBottomRight:[40,100],maxZoom:17});
};
$('mapbar').onclick=()=>{$('mapbar').classList.add('hide');$('follow').classList.remove('hide');startDots()};

/* simulatie: loopt de route af (ook het stukje naar de start) zodat je thuis kunt testen */
function stopSim(){clearInterval(F.sim);F.sim=null;$('simBtn').querySelector('span').textContent='Simuleer'}
$('simBtn').onclick=()=>{
  if(F.sim){stopSim();return}
  const p=F.route.pts;let path;
  if(F.phase==='start'||F.hunt&&F.idx===0){const s=me&&dist(me,p[0])<400?me:[p[0][0]-.0004,p[0][1]-.0006];path=[s,...p]}
  else path=[me||p[Math.max(0,F.idx-1)],...p.slice(F.idx)];
  fakePos=true;F.simUsed=true;let i=0,t=0;setMe([...path[0]]);
  $('simBtn').querySelector('span').textContent='Pauze';
  F.sim=setInterval(()=>{
    if(F.paused)return;
    const a=path[i],b=path[i+1];if(!b)return stopSim();
    heading=(bearing(a,b)+Math.sin(Date.now()/900)*14+360)%360; // kijk ongeveer in looprichting
    t+=Math.min(1,6/Math.max(dist(a,b),1));
    if(t>=1){i++;t=0;return setMe([...b])}
    setMe([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);
  },400);
};

/* stippen rond de pijl, trekken samen als je dichterbij komt */
const cv=$('dots'),cx=cv.getContext('2d');
const DOTS=Array.from({length:80},()=>({a:Math.random()*Math.PI*2,r:Math.random(),s:.4+Math.random(),ph:Math.random()*7}));
let dotR=null,dotsRunning=false;
function startDots(){if(!dotsRunning){dotsRunning=true;requestAnimationFrame(dotsLoop)}}
function dotsLoop(t){
  if(!F.route||$('follow').classList.contains('hide')){dotsRunning=false;return}
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
  const ringR=$('ring').clientWidth/2||Math.min(w,h)/2,goal=ringR*(F.d==null?.8:.42+.43*Math.min(1,F.d/120));
  dotR=dotR==null?goal:dotR+(goal-dotR)*.05;
  const dir=rad(F.arrowRot??0)-Math.PI/2,known=heading!=null&&F.d!=null;
  for(const p of DOTS){
    const ang=p.a+t/14000*p.s,rr=dotR*(.8+.28*p.r)+Math.sin(t/800+p.ph)*3;
    const x=w/2+Math.cos(ang)*rr,y=h/2+Math.sin(ang)*rr;
    const face=known?Math.max(0,Math.cos(ang-dir))**3:0;
    const al=.18+.7*face+.12*Math.sin(t/450+p.ph);
    cx.fillStyle=`rgba(255,255,255,${Math.max(.06,Math.min(1,al))})`;
    cx.beginPath();cx.arc(x,y,1.3+p.s*1.2+face*1.5,0,Math.PI*2);cx.fill();
  }
  requestAnimationFrame(dotsLoop);
}

function confetti(c,count){
  const g=c.getContext('2d'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const P=Array.from({length:count},()=>({x:w/2+(Math.random()-.5)*60,y:h*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:COLORS[Math.random()*COLORS.length|0],s:5+Math.random()*5}));
  const t0=performance.now();
  (function f(t){
    g.clearRect(0,0,w,h);const age=(t-t0)/1000;
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-age/3.2);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});
    if(age<3.3)requestAnimationFrame(f);else g.clearRect(0,0,w,h);
  })(t0);
}

/* ---------- start ---------- */
setTabH();setTab('routes');setSnap('half');
setOnline();startGPS();loadWeather();checkImport();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
